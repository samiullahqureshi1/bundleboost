<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2540"/><stop offset="1" stop-color="#121019"/></linearGradient>
    <linearGradient id="t-tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7BFF"/><stop offset="1" stop-color="#5FF0B8"/></linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#t-bg)"/>
  <!-- Price tag, tilted. -->
  <g transform="translate(-15 0) rotate(-38 600 600)">
