<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19C2A7"/><stop offset="1" stop-color="#0A6E8A"/></linearGradient>
    <radialGradient id="l-glow" cx="0.2" cy="0.15" r="0.8"><stop offset="0" stop-color="#FFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#l-bg)"/>
  <rect width="1200" height="1200" fill="url(#l-glow)"/>
  <!-- three stacked layers, growing brighter toward the top -->
  <path d="M600 760 L900 870 L600 980 L300 870 Z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M600 610 L900 720 L600 830 L300 720 Z" fill="#FFFFFF" opacity="0.7"/>
  <path d="M600 460 L900 570 L600 680 L300 570 Z" fill="#FFFFFF"/>
  <!-- boost chevron -->
  <path d="M430 360 L600 210 L770 360" fill="none" stroke="#FFE27A" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
