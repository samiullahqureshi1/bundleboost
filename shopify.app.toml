# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4f89a504ab43c78ac4bd3017e4a315cc"
application_url = "https://example.com"
embedded = true
name = "bundleboost"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: resource picker + server-side product verification.
# write_discounts: create/update the automatic app discounts that run the
# BundleBoost Discount Function.
scopes = "read_products,write_discounts"

# Function configuration for each campaign's automatic discount. Written only
# by the app; merchants can view but not edit it.
[discount.metafields.app.function-configuration]
type = "json"
name = "BundleBoost configuration"

  [discount.metafields.app.function-configuration.access]
  admin = "merchant_read"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory compliance webhooks for App Store distribution.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
