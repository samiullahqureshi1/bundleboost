query CartLinesDiscountsGenerateRunInput {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      # Only whether the line is a subscription matters (cheapest selection).
      sellingPlanAllocation {
        __typename
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
